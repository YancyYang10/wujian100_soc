# Wujian100 verify/st regression configuration

jobs = 4
retry = 0
timeout = 1

case_list = case.lst
pl = UVM_MEDIUM

# Coverage is off by default for functional regression (fast, no shared-vdb
# contention). Re-enable with: -j 1 --coverage --urg
coverage = false
coverage_args = -cm line+cond+fsm+branch+tgl+assert
urg_report = false

fail_keywords = UVM_FATAL\s*:\s*[1-9]\d*|UVM_ERROR\s*:\s*[1-9]\d*|UVM TEST FAILED|Test Fail
pass_keywords = UVM TEST PASSED|HAD TEST PASS

# keep waveforms off during regression; use wave=1 for single-case debug.
# HDL_ACCESS=1 enables the VPI backdoor used by +HW_STIM (uvm_hdl_*) at
# compile time, since the per-case plusarg is not known when the mode is built.
global_args = wave=0 HDL_ACCESS=1
